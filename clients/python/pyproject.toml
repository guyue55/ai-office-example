[project]
name = "office-client"
version = "1.1.0"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.13,<3.15"
dependencies = ["office-api-contracts[httpx]", "httpx>=0.28,<1", "keyring>=25,<26"]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["src/office_client"]
[project.scripts]
office = "office_client.cli:main"

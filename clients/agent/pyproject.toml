[project]
name = "office-agent"
version = "1.0.0"
description = "复用企业办公受控服务的独立员工端 Agent"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.13,<3.15"
dependencies = ["office-client==1.0.0", "pydantic-ai-slim[openai]==2.61.0"]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/office_agent"]

# 独立锁文件：模型依赖不进入服务器或普通客户端的安装闭包。
[tool.uv.sources]
office-client = { path = "../python", editable = true }
office-api-contracts = { path = "../../packages/api-contracts", editable = true }

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.12,<1", "mypy>=1.17,<2"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.mypy]
python_version = "3.13"
check_untyped_defs = true
mypy_path = "$MYPY_CONFIG_FILE_DIR/../python/src"

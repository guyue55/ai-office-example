name: 准备发版候选
# 只构建候选，不创建标签、Release或部署实例。
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 候选版本，必须与VERSION一致
        required: true
        default: v1.0.0
permissions:
  contents: read
concurrency:
  group: release-candidate-${{ github.ref }}
  cancel-in-progress: false
jobs:
  checks:
    uses: ./.github/workflows/ci.yml
  candidate:
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.9.18'
          python-version: '3.13'
      - run: uv sync --locked
      - name: 构建确定提交的候选制品
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: uv run --frozen python scripts/prepare_release.py --tag "$RELEASE_TAG" --output dist/release-candidate
      - name: 核对资产白名单、归档边界与来源
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: uv run --frozen python scripts/verify_release.py dist/release-candidate --tag "$RELEASE_TAG" --commit "$GITHUB_SHA"
      - name: 核对所有制品摘要
        working-directory: dist/release-candidate
        run: sha256sum --check SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-candidate-${{ github.run_id }}
          path: dist/release-candidate/*
          if-no-files-found: error
          retention-days: 30

name: 手动构建发布服务镜像
# 仅生成内网部署制品，不连接客户服务器；须管理员配置image-release环境审批。
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/ci.yml
  publish:
    needs: checks
    # 私有仓库套餐可能不支持环境审批；默认关闭发布，管理员确认后显式启用。
    if: vars.ENABLE_IMAGE_RELEASE == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: image-release
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: 确定小写镜像路径
        id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}/data-service" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/Dockerfile
          push: true
          tags: ${{ steps.image.outputs.name }}:sha-${{ github.sha }}
          sbom: true
          provenance: mode=min

        env:
          DOCKER_BUILD_RECORD_UPLOAD: "false"

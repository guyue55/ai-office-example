name: 缺陷报告
description: 报告技能、服务端设计、文档或工程配置中的可复现问题
title: "[缺陷] "
labels:
  - 缺陷
body:
  - type: markdown
    attributes:
      value: |
        请先移除真实凭证、客户数据、人员姓名、连接串和未公开的业务金额。安全问题不要使用普通 Issue，应遵循 SECURITY.md 的私密报告边界。
  - type: dropdown
    id: area
    attributes:
      label: 影响范围
      options:
        - 通用技能套件
        - 技能套件其他模块
        - 服务端设计或接口契约
        - 部署配置
        - 文档
        - 其他
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: 问题描述
      description: 说明发生了什么、影响什么业务动作，以及当前是否使用构造数据。
      placeholder: 例如：在隔离副本中执行某命令后，预期阻断但实际继续生成预览。
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 最小复现步骤
      description: 提供可重复的命令、参数或文件结构；附件中不得含敏感数据。
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期结果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果与错误信息
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 验证证据
      description: 记录版本、环境、执行时间和检查结果；不要粘贴真实凭证或敏感日志。
  - type: checkboxes
    id: safety
    attributes:
      label: 安全检查
      options:
        - label: 本表单不含真实凭证、客户敏感数据、个人敏感信息或可利用的安全细节。
          required: true
        - label: 我已确认这不是需要私下报告的安全问题。
          required: true

[project]
name = "office-api-contracts"
version = "1.1.0"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
description = "可复用的强类型接口契约与协议适配"
readme = "README.md"
requires-python = ">=3.13,<3.15"
dependencies = ["pydantic>=2.14.1,<3"]
[project.optional-dependencies]
fastapi = ["fastapi>=0.143.3,<1"]
httpx = ["httpx>=0.28.1,<1"]
mcp = ["mcp>=2.3,<3"]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["src/office_contracts"]

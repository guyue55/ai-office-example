{% macro permission_table(entries, empty_message='暂无权限。需要使用相关功能时，请联系管理员配置角色。') -%}
{% if entries %}
<div class="table-wrap" role="region" aria-label="权限明细表格区域" tabindex="0">
<table class="data-table" role="table" aria-label="权限明细表格">
<thead>
<tr>
<th>权限名称</th>
<th>权限编码</th>
<th>用途与范围</th>
<th>类别</th>
</tr>
</thead>
<tbody>
{% for p in entries %}
<tr>
<td>
<span class="cell-title">{{ p.name }}</span>

</td>
<td><span class="code">{{ p.code }}</span></td>
<td><span class="permission-description" tabindex="0" data-tooltip="{{ p.description }}">{{ p.description }}</span></td>
<td>
<span class="badge neutral">{{ p.group }}</span>
</td>
</tr>{% endfor %}
</tbody>
</table>
</div>{% else %}
<div class="empty">{{ empty_message }}</div>{% endif %}
{%- endmacro %}

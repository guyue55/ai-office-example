{% extends 'base.html' %}
{% block title %}临时密码 · {{ product.short_name }}{% endblock %}
{% block content %}
<header class="page-header"><div><p class="eyebrow">安全操作</p><h2>临时密码已准备</h2></div></header>
<section class="card"><p>仅此响应展示一次。请采用企业批准的点对点方式交付，不要发到群里或粘贴给 AI 工具。员工首次登录必须修改。</p>
<label class="credential-field">临时密码<input id="temporary-password" type="password" readonly value="{{ password }}" autocomplete="off" spellcheck="false"></label>
<button class="secondary" type="button" id="show-password" aria-pressed="false">显示密码</button>
<p class="muted">刷新无法找回该明文。账号启用结果以处理进度为准。</p><a class="button" href="/console/accounts/operations/{{ identifier }}">查看开通结果</a>
</section>
<script>document.getElementById('show-password').addEventListener('click', function () {const input = document.getElementById('temporary-password'); const show = input.type === 'password'; input.type = show ? 'text' : 'password'; this.textContent = show ? '隐藏密码' : '显示密码'; this.setAttribute('aria-pressed', String(show));});</script>
{% endblock %}

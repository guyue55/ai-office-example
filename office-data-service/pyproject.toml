[project]
name = "office-data-service"
version = "1.1.0"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.13,<3.15"
dependencies = [
    "office-api-contracts[fastapi,mcp]",
    "fastapi>=0.135,<1",
    "uvicorn>=0.30,<1",
    "sqlalchemy[asyncio]>=2.0,<3",
    "psycopg[binary]>=3.3,<4",
    "alembic>=1.16,<2",
    "pyjwt[crypto]>=2.12,<3",
    "cryptography>=46,<51",
    "pycasbin==2.8.0",
    "mcp==2.3.0",
    "httpx>=0.28,<1",
    "pydantic-settings>=2.10,<3",
    "jinja2>=3.1,<4",
]

[project.optional-dependencies]
agent = ["office-agent==1.1.0"]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["app"]
[project.scripts]
office-service = "app.entrypoints.cli:main"
